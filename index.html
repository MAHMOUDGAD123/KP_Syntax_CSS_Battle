<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS</title>
    <link rel="icon" href="./css.svg" type="image/x-icon" />
    <link rel="stylesheet" href="./index.css" />
  </head>

  <body>
    <header>
      <img src="./css.svg" alt="css" />
    </header>

    <!-- CSS Battle -->

    <details name="detailsgroup" open>
      <summary>SPACE SHIP 🛸</summary>

      <div class="content">
        <fieldset class="css-battle battle1">
          <div></div>
        </fieldset>
      </div>
    </details>

    <details name="detailsgroup" open>
      <summary>Snake (box-shadow)</summary>

      <div class="content">
        <fieldset class="css-battle battle2-1">
          <div></div>
        </fieldset>
      </div>
    </details>

    <details name="detailsgroup" open>
      <summary>Snake grid (perfect & easy)</summary>

      <div class="content">
        <fieldset class="css-battle battle2-1">
          <div>
            <div style="grid-area: c"></div>
            <div style="grid-area: r1"></div>
            <div style="grid-area: r2"></div>
            <div style="grid-area: r3"></div>
            <div style="grid-area: r4"></div>
            <div style="grid-area: r5"></div>
            <div style="grid-area: r6"></div>
            <div style="grid-area: r7"></div>
            <div style="grid-area: r8"></div>
            <div style="grid-area: r9"></div>
            <div style="grid-area: r10"></div>
            <div style="grid-area: r11"></div>
            <div style="grid-area: r12"></div>
            <div style="grid-area: r13"></div>
            <div style="grid-area: r14"></div>
            <div style="grid-area: r15"></div>
            <div style="grid-area: r16"></div>
            <div style="grid-area: r17"></div>
            <div style="grid-area: r18"></div>
          </div>
        </fieldset>
      </div>
    </details>
  </body>
</html>
